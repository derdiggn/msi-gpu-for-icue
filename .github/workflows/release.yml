# Semantic versioning from Conventional Commits.
#
# On every push to main, release-please opens or updates a "release PR" that
# bumps src/version.h, version.txt and CHANGELOG.md according to the commits
# since the last release (fix/perf -> patch, feat -> minor, ! or
# BREAKING CHANGE -> major). Merging that PR tags vX.Y.Z and creates the
# GitHub release. Then:
#   build    builds the zip and the setup.exe from the tag and tests them end to
#            end. It runs third-party tools (MSVC, Chocolatey's Inno Setup) and
#            therefore gets a read-only token and no OIDC/attestation rights.
#   publish  only downloads the built files, attests their provenance and
#            attaches them to the release. It runs no build tools.
#
# Note: pull requests opened with GITHUB_TOKEN do not trigger other workflows,
# so ci.yml does not run on the release PR itself. Do not make CI a required
# status check for main, or close and reopen the release PR to run it.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # renovate: datasource=nuget registryUrl=https://community.chocolatey.org/api/v2/ depName=innosetup
  INNOSETUP_VERSION: 6.7.1

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tags and releases
      pull-requests: write   # the release PR
      issues: write          # labels on the release PR
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Unit tests
        shell: pwsh
        run: ./test.ps1

      - name: Install Inno Setup and check its publisher
        shell: pwsh
        run: |
          choco install innosetup --version $env:INNOSETUP_VERSION -y --no-progress
          $sig = Get-AuthenticodeSignature "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '^CN=Pyrsys B\.V\.,') {
            throw "ISCC.exe is not signed by the Inno Setup publisher: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }

      - name: Package zip and setup.exe
        shell: pwsh
        run: ./package.ps1 -Installer

      - name: Installer end-to-end test
        shell: pwsh
        run: ./tests/e2e/installer.ps1 -Setup (Get-ChildItem dist/*-setup-*.exe).FullName -LogDir "$env:RUNNER_TEMP/e2e-logs"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.zip*
            dist/*.exe*
          if-no-files-found: error

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # attach files to the release
      id-token: write       # build provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.zip
            dist/*.exe

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber
