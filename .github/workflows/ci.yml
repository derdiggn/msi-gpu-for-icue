name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Tool versions; Renovate keeps them up to date (see renovate.json).
env:
  # renovate: datasource=nuget registryUrl=https://community.chocolatey.org/api/v2/ depName=opencppcoverage
  OPENCPPCOVERAGE_VERSION: 0.9.9.0
  # renovate: datasource=nuget registryUrl=https://community.chocolatey.org/api/v2/ depName=innosetup
  INNOSETUP_VERSION: 6.7.1
  # renovate: datasource=nuget registryUrl=https://www.powershellgallery.com/api/v2/ depName=PSScriptAnalyzer
  PSSCRIPTANALYZER_VERSION: 1.24.0

jobs:
  build-test:
    name: build, test, coverage, package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Install OpenCppCoverage and Inno Setup
        shell: pwsh
        run: |
          choco install opencppcoverage --version $env:OPENCPPCOVERAGE_VERSION -y --no-progress
          choco install innosetup --version $env:INNOSETUP_VERSION -y --no-progress
          $sig = Get-AuthenticodeSignature "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch '^CN=Pyrsys B\.V\.,') {
            throw "ISCC.exe is not signed by the Inno Setup publisher: $($sig.Status) $($sig.SignerCertificate.Subject)"
          }

      - name: Unit tests with 100 % line coverage gate
        shell: pwsh
        run: ./test.ps1 -Coverage -OpenCppCoverage "$env:ProgramFiles\OpenCppCoverage\OpenCppCoverage.exe"

      - name: Package zip and setup.exe
        shell: pwsh
        run: ./package.ps1 -Installer

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            build/coverage
            build/coverage.xml
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi-gpu-for-icue
          path: |
            dist/*.zip*
            dist/*.exe*
          if-no-files-found: error

  installer-e2e:
    name: installer end-to-end
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msi-gpu-for-icue
          path: dist

      - name: Install, upgrade and uninstall on the runner
        shell: pwsh
        run: ./tests/e2e/installer.ps1 -Setup (Get-ChildItem dist/*-setup-*.exe).FullName -LogDir "$env:RUNNER_TEMP/e2e-logs"

      - name: Upload setup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-logs
          path: ${{ runner.temp }}/e2e-logs
          if-no-files-found: ignore

  lint-scripts:
    name: PowerShell lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION -Force
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error, Warning `
            -ExcludeRule PSAvoidUsingWriteHost, PSUseShouldProcessForStateChangingFunctions
          $issues | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          if ($issues) { throw "$($issues.Count) PSScriptAnalyzer finding(s)" }

  commits:
    name: conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json
