name: Card report
description: Tell us whether the plugin works on a card that is not marked as tested yet.
labels: [card-report]
body:
  - type: input
    id: card
    attributes:
      label: Graphics card
      placeholder: MSI GeForce RTX 5090 Gaming Trio OC
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Works (static colours and effects follow iCUE)
        - Partly works
        - Card detected but no lighting change
        - Card not detected
    validations:
      required: true
  - type: textarea
    id: gputest
    attributes:
      label: Output of `build\gputest.exe detect`
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: For example what `build\gputest.exe direct 40 10` showed (close iCUE first).
