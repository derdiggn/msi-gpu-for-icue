; Settings for msi-gpu-for-icue.
; Location after install: %ProgramData%\MsiGpuForIcue\settings.ini
; Editing requires administrator rights. Changes take effect the next time iCUE starts.
; Missing keys keep their default; out-of-range values are clamped.
[plugin]

; Minimum time between two colour updates in ms, 10..1000
; (33 = ~30 fps; 40 = 25 fps is verified smooth).
FrameMs=33

; Switch the GPU LEDs off when iCUE quits (1) or keep the last colour (0).
TurnOffOnExit=0

; Log every colour change into plugin.log (only for debugging).
Verbose=0

; --- advanced: only change these when troubleshooting ---------------------
; How the device is presented to iCUE. Defaults mirror Corsair's own plugins.
;ApiVersion=105      plugin API version reported to iCUE (105 = 0x69)
;Features=4          feature bits: 4 = detached mode, 0 = none (other bits are ignored)
;DeviceType=4        iCUE device type (4 = GPU)
;LedCount=1          virtual LED zones shown in iCUE, 1..50, averaged to one colour
;InitDelayMs=0       delay after each register write of the init sequence, 0..100 ms
